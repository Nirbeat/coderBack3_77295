openapi: 3.0.1
info:
  title: AdoptMe Users API
  description: API para gestionar usuarios en la plataforma AdoptMe
  version: 1.0.0

# LA PROPIEDAD PATH DEFINE LOS ENDPOINTS DISPONIBLES PARA SUS SUBRUTAS
paths:
# SE ESPECIFICA LA RUTA Y EL METODO
  /api/users:
    get:
    # DESCRIPCIONES DEL ENDPOINT
      summary: Obtener todos los usuarios
      description: Devuelve una lista completa de todos los usuarios registrados en el sistema
      # ETIQUETAS PARA AGRUPAR ENDPOINTS SIMILARES
      tags:
        - Users
        # RESPUESTAS QUE PUEDE DAR EL ENDPOINT
      responses:
        '200':
          description: Lista de usuarios obtenida exitosamente
          content:
          # TIPO DE RESPUESTA
            application/json:
            # ESQUEMA DE LA RESPUESTA
              schema:
                type: array
                items:
                # ESTA REFERENCIA APUNTA AL ESQUEMA DEFINIDO EN COMPONENTS PARA EL OBJETO USER
                  $ref: '#/components/schemas/User'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# LOS PARAMETROS EN LA RUTA SE DEFINEN ENTRE LLAVES {}
  /api/users/{uid}:
    get:
      summary: Obtener un usuario por ID
      description: Obtiene los detalles de un usuario específico mediante su ID
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: ID único del usuario
          schema:
            type: string
      responses:
        '200':
          description: Usuario encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Actualizar un usuario
      description: Actualiza los datos de un usuario específico
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: ID único del usuario
          schema:
            type: string
      # EN LAS RUTAS QUE LO REQUIEREN SE DEFINE EL CUERPO DE LA PETICION
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: Usuario actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Eliminar un usuario
      description: Elimina un usuario del sistema
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: ID único del usuario
          schema:
            type: string
      responses:
        '204':
          description: Usuario eliminado exitosamente
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# DEFINICION DE ESQUEMAS UTILIZADOS EN LAS RESPUESTAS Y PETICIONES
components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: ObjectId
          description: ID único del usuario
        first_name:
          type: string
          description: Nombre del usuario
        last_name:
          type: string
          description: Apellido del usuario
        email:
          type: string
          format: email
          description: Correo electrónico del usuario
        password:
          type: string
          description: Contraseña encriptada del usuario
      # AGREGAR UN EJEMPLO DE RESPUESTA PARA EL ESQUEMA
      example:
        _id: 64a7b2f5e1d3c2b1a5f6e7d8
        first_name: Juan
        last_name: Pérez
        email: juanperez@mail.com
        password: $2b$10$EixZaYVK1fsbw1ZfbX3OXePaWxn96p36Z1Z4bY5E6k1Jq6Z5eF6aG

    UpdateUser:
      type: object
      properties:
        _id:
          type: ObjectId
          description: ID único del usuario
        first_name:
          type: string
          description: Nombre del usuario
        last_name:
          type: string
          description: Apellido del usuario
        email:
          type: string
          format: email
          description: Correo electrónico del usuario
        password:
          type: string
          description: Contraseña encriptada del usuario
      example:
        _id: 64a7b2f5e1d3c2b1a5f6e7d8
        first_name: Juan
        last_name: Pérez
        email: juanperez@mail.com
        password: $2b$10$EixZaYVK1fsbw1ZfbX3OXePaWxn96p36Z1Z4bY5E6k1Jq6Z5eF6aG

    Error:
      type: object
      properties:
        status:
          type: integer
          description: Código de estado HTTP
        message:
          type: string
          description: Mensaje de error
        error:
          type: string
          description: Detalle del error
      example:
        status: 500
        message: Error interno del servidor
        error: No se pudo conectar a la base de datos